name: open-media-flow

services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      OMF_STORE_BACKEND: postgres
      OMF_SCHEDULER_ENABLED: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-open_media_flow}:${POSTGRES_PASSWORD:-local-dev-only}@postgres:5432/${POSTGRES_DB:-open_media_flow}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      video-engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  video-engine:
    build:
      context: ./services/video-engine
    environment:
      MPT_API_KEY: ${MPT_API_KEY:-}
    ports:
      - "127.0.0.1:${MPT_HOST_PORT:-8082}:8080"
    volumes:
      - ./data/video-engine/runtime:/runtime
      - ./data/video-engine/storage:/MoneyPrinterTurbo/storage
      - ./data/inbox:/MoneyPrinterTurbo/storage/local_videos
      - ./data/output/video-engine:/MoneyPrinterTurbo/storage/tasks
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-open_media_flow}
      POSTGRES_USER: ${POSTGRES_USER:-open_media_flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-open_media_flow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-dev-only}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
